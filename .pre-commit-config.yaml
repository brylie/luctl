repos:
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        language: system
        entry: mise exec -- golangci-lint run ./...
        pass_filenames: false
        types: [go]

      - id: markdownlint
        name: markdownlint
        language: system
        entry: mise exec -- markdownlint-cli2
        types: [markdown]
